query ListPieces($all: Boolean) {
  medusaQueries {
    pieces(all: $all) {
      id
      slug
      name
      description
      isKing
      promotionTargets
      promotionRanks
      moveStates
      stateTransition
      edgeReset
      isSystem
      createdBy
      ownerName
      sprite {
        headKey
        bodyKey
        footKey
      }
    }
  }
}
