query GetGame($code: String!) {
  medusaQueries {
    game(code: $code) {
      id
      code
      boardLayoutId
      boardLayoutName
      status
      initialState
      finalState
      creatorAccountId
      whiteAccountId
      blackAccountId
      whitePlayer {
        id
        username
      }
      blackPlayer {
        id
        username
      }
      viewerSeat
      result
      winnerAccountId
      moveCount
      createdAt
      startedAt
      finishedAt
      archivedAt
      moves {
        ply
        move
        playedAt
      }
    }
  }
}
